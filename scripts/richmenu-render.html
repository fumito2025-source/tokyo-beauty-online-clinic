<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;500&family=Noto+Sans+JP:wght@300;400&display=swap');

  :root {
    --bg: #0A0A0A;
    --gold: #C9A84C;
    --gold-dim: rgba(201,168,76,0.15);
    --text: #F5F0E8;
    --text-dim: rgba(245,240,232,0.55);
    --border: rgba(201,168,76,0.3);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 2500px;
    height: 1686px;
    background: var(--bg);
    overflow: hidden;
  }

  .richmenu {
    width: 2500px;
    height: 1686px;
    background: var(--bg);
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(2, 1fr);
    position: relative;
  }

  .richmenu::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      linear-gradient(to right, transparent calc(33.33% - 1px), var(--border) calc(33.33% - 1px), var(--border) calc(33.33% + 1px), transparent calc(33.33% + 1px)),
      linear-gradient(to right, transparent calc(66.66% - 1px), var(--border) calc(66.66% - 1px), var(--border) calc(66.66% + 1px), transparent calc(66.66% + 1px)),
      linear-gradient(to bottom, transparent calc(50% - 1px), var(--border) calc(50% - 1px), var(--border) calc(50% + 1px), transparent calc(50% + 1px));
    pointer-events: none;
    z-index: 2;
  }

  .cell {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 40px;
    padding: 60px;
    position: relative;
  }

  .icon-wrap {
    width: 210px;
    height: 210px;
    border: 3px solid var(--border);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .cell.primary .icon-wrap {
    border-color: var(--gold);
    background: var(--gold-dim);
  }

  .icon-wrap svg {
    width: 96px;
    height: 96px;
  }

  .cell-label {
    font-family: 'Noto Serif JP', 'Hiragino Mincho ProN', serif;
    font-weight: 400;
    font-size: 92px;
    color: var(--text);
    letter-spacing: 0.15em;
    text-align: center;
  }

  .cell-sub {
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 42px;
    color: var(--text-dim);
    letter-spacing: 0.2em;
    text-align: center;
  }

  .corner-logo {
    position: absolute;
    top: 32px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Noto Serif JP', serif;
    font-size: 28px;
    letter-spacing: 0.25em;
    color: rgba(201,168,76,0.4);
    z-index: 3;
    white-space: nowrap;
  }
</style>
</head>
<body>
<div class="richmenu">
  <span class="corner-logo">TOKYO BEAUTY ONLINE CLINIC</span>

  <!-- ご予約 -->
  <div class="cell primary">
    <div class="icon-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="#C9A84C" stroke-width="1.4" stroke-linecap="round">
        <rect x="3" y="4" width="18" height="18" rx="2"/>
        <line x1="16" y1="2" x2="16" y2="6"/>
        <line x1="8" y1="2" x2="8" y2="6"/>
        <line x1="3" y1="10" x2="21" y2="10"/>
        <line x1="8" y1="14" x2="8" y2="14" stroke-width="2"/>
        <line x1="12" y1="14" x2="12" y2="14" stroke-width="2"/>
      </svg>
    </div>
    <div class="cell-label">ご予約</div>
    <div class="cell-sub">RESERVATION</div>
  </div>

  <!-- プラン・料金 -->
  <div class="cell">
    <div class="icon-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="#C9A84C" stroke-width="1.4" stroke-linecap="round">
        <circle cx="12" cy="12" r="9"/>
        <path d="M12 7v5l3 3"/>
        <line x1="9" y1="1" x2="9" y2="3"/>
        <line x1="15" y1="1" x2="15" y2="3"/>
      </svg>
    </div>
    <div class="cell-label">プラン・料金</div>
    <div class="cell-sub">PLAN & PRICE</div>
  </div>

  <!-- 薬の説明 -->
  <div class="cell">
    <div class="icon-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="#C9A84C" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="9" width="18" height="6" rx="3"/>
        <line x1="12" y1="9" x2="12" y2="15" stroke="#C9A84C"/>
        <rect x="3" y="9" width="9" height="6" rx="3" fill="#C9A84C" stroke="none"/>
      </svg>
    </div>
    <div class="cell-label">薬の説明</div>
    <div class="cell-sub">MEDICATION</div>
  </div>

  <!-- 経過・ご相談 -->
  <div class="cell">
    <div class="icon-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="#C9A84C" stroke-width="1.4" stroke-linecap="round">
        <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/>
        <line x1="8" y1="9" x2="16" y2="9"/>
        <line x1="8" y1="13" x2="13" y2="13"/>
        <circle cx="17" cy="17" r="4" fill="#0A0A0A" stroke="#C9A84C"/>
        <line x1="15.5" y1="17" x2="18.5" y2="17"/>
        <line x1="17" y1="15.5" x2="17" y2="18.5"/>
      </svg>
    </div>
    <div class="cell-label">経過・ご相談</div>
    <div class="cell-sub">CONSULTATION</div>
  </div>

  <!-- よくある質問 -->
  <div class="cell">
    <div class="icon-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="#C9A84C" stroke-width="1.4" stroke-linecap="round">
        <circle cx="12" cy="12" r="9"/>
        <path d="M9.09 9a3 3 0 015.83 1c0 2-3 3-3 3"/>
        <line x1="12" y1="17" x2="12.01" y2="17" stroke-width="2"/>
      </svg>
    </div>
    <div class="cell-label">よくある質問</div>
    <div class="cell-sub">FAQ</div>
  </div>

  <!-- お問い合わせ -->
  <div class="cell">
    <div class="icon-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="#C9A84C" stroke-width="1.4" stroke-linecap="round">
        <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/>
        <line x1="8" y1="10" x2="16" y2="10"/>
        <line x1="8" y1="14" x2="12" y2="14"/>
      </svg>
    </div>
    <div class="cell-label">お問い合わせ</div>
    <div class="cell-sub">CONTACT</div>
  </div>
</div>
</body>
</html>
